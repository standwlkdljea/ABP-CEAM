<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Registro de Cliente - VetCuidado</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-50 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 max-w-md w-full">
    <div class="text-center mb-6">
      <span class="text-3xl">🐾</span>
      <h1 class="text-2xl font-bold text-cyan-600">VetCuidado</h1>
      <p class="text-gray-600 text-sm">Crea tu cuenta de cliente</p>
    </div>
    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-xl text-sm">{{ messages[0] }}</div>
    {% endif %}
    {% endwith %}
    <form method="POST" action="{{ url_for('auth.register_client') }}" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Nombre completo</label>
        <input type="text" name="full_name" required
          class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">DNI</label>
        <input type="text" name="dni" required
          class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Correo electrónico</label>
        <input type="email" name="email" required
          class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Teléfono</label>
        <input type="text" name="phone" class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Contraseña</label>
        <input type="password" name="password" required minlength="6"
          class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm">
      </div>
      <button type="submit"
        class="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-semibold py-2.5 rounded-xl transition">Registrarse</button>
    </form>
    <p class="text-center text-sm text-gray-500 mt-4">
      ¿Ya tienes cuenta? <a href="{{ url_for('auth.login_client') }}" class="text-cyan-600 font-semibold">Inicia sesión</a>
    </p>
  </div>
</body>

</html>
