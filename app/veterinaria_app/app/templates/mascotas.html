<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VetCuidado - Mis Mascotas</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="bg-gray-50 text-gray-800 font-sans">

  <header class="bg-white shadow-md sticky top-0 z-50">
    <!-- same header as index, but with dynamic login check -->
    <div class="container mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center">
      <div class="flex items-center space-x-2 text-cyan-600 font-bold text-2xl mb-4 sm:mb-0">
        <span>🐾</span>
        <span>VetCuidado</span>
      </div>
      <nav class="flex space-x-6 font-medium">
        <a href="{{ url_for('auth.home') }}" class="text-gray-600 hover:text-cyan-600 transition">Inicio</a>
        <a href="{{ url_for('client.mascotas') }}" class="text-cyan-600 hover:text-cyan-700 transition">Mis Mascotas</a>
        <a href="{{ url_for('client.citas') }}"
          class="bg-cyan-600 text-white px-4 py-2 rounded-lg hover:bg-cyan-700 transition shadow">Pedir Cita</a>
      </nav>
    </div>
  </header>

  <main class="container mx-auto px-4 py-10 max-w-6xl">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
      <div>
        <h1 class="text-3xl font-bold text-gray-900">Mis Mascotas</h1>
        <p class="text-gray-600">Administra los datos de tus animales. Puedes añadir nuevas mascotas o editar las
          existentes.</p>
      </div>
      <button id="btnAddPet"
        class="bg-cyan-600 hover:bg-cyan-700 text-white font-semibold px-5 py-2.5 rounded-xl transition shadow flex items-center gap-2 cursor-pointer">
        <span>➕</span> Añadir Nueva Mascota
      </button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8" id="petsContainer">
      <!-- Rendered by JS from a JSON array passed via Jinja2 -->
    </div>

    <!-- Hidden modal for adding a new pet -->
    <div id="modalAddPet" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/40">
      <div class="bg-white rounded-2xl p-6 w-full max-w-md mx-4">
        <h2 class="text-xl font-bold mb-4">Registrar nueva mascota</h2>
        <form id="formAddPet" class="space-y-3">
          <input type="text" id="petName" placeholder="Nombre"
            class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm" required>
          <input type="text" id="petType" placeholder="Tipo (Perro, Gato, Ave...)"
            class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm" required>
          <input type="number" id="petAge" placeholder="Edad (años)" min="0"
            class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm" required>
          <textarea id="petDesc" placeholder="Descripción / observaciones" rows="2"
            class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm resize-none"></textarea>
          <div class="flex justify-end gap-3 pt-2">
            <button type="button" id="btnCloseModal"
              class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-sm">Cancelar</button>
            <button type="submit"
              class="px-4 py-2 bg-cyan-600 hover:bg-cyan-700 text-white rounded-xl text-sm font-semibold">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="bg-gray-900 text-gray-400 py-8 border-t border-gray-800 mt-20">
    <div class="container mx-auto px-4 text-center text-sm">&copy; 2026 VetCuidado</div>
  </footer>

  <script>
    const petsData = {{pets | tojson | safe }};
    // Render pets list
  </script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
