<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VetCuidado - Agendar Cita Online</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="bg-gray-50 text-gray-800 font-sans">

  <header class="bg-white shadow-md sticky top-0 z-50">
    <div class="container mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center">
      <div class="flex items-center space-x-2 text-cyan-600 font-bold text-2xl mb-4 sm:mb-0">
        <span>🐾</span>
        <span>VetCuidado</span>
      </div>
      <nav class="flex space-x-6 font-medium">
        <a href="{{ url_for('auth.home') }}" class="text-gray-600 hover:text-cyan-600 transition">Inicio</a>
        <a href="{{ url_for('client.mascotas') }}" class="text-gray-600 hover:text-cyan-600 transition">Mis Mascotas</a>
        <a href="{{ url_for('client.citas') }}"
          class="bg-cyan-600 text-white px-4 py-2 rounded-lg hover:bg-cyan-700 transition shadow">Pedir Cita</a>
      </nav>
    </div>
  </header>

  <main class="container mx-auto px-4 py-12 max-w-xl">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900 mb-2">Solicitar Cita Veterinaria</h1>
      <p class="text-gray-600 text-sm">Selecciona tu mascota, el servicio deseado y la fecha/hora. El sistema asignará
        un veterinario disponible.</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
      <form id="formCita" class="space-y-6">

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Mascota</label>
          <select id="pet_id" name="pet_id" required
            class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-cyan-500 text-sm">
            <option value="">Selecciona una mascota</option>
            {% for pet in pets %}
            <option value="{{ pet.id }}">{{ pet.nombre_mascota }} ({{ pet.tipo_mascota }}, {{ pet.edad }} años)</option>
            {% endfor %}
          </select>
          <p class="text-xs text-gray-400 mt-1">¿Mascota nueva? <a href="{{ url_for('client.mascotas') }}"
              class="text-cyan-600 underline">Añádela aquí</a> antes de continuar.</p>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Servicio</label>
          <select id="service_id" name="service_id" required
            class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm">
            <option value="">Selecciona un servicio</option>
            {% for service in services %}
            <option value="{{ service.id }}">{{ service.nombre }} ({{ service.duracion_minutos }} min)</option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Fecha y Hora Deseada</label>
          <input type="datetime-local" id="start_time" name="start_time" required
            class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-cyan-500 text-sm">
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Motivo de la Consulta</label>
          <textarea id="motivo" name="motivo" rows="4" required placeholder="Describe los síntomas o el motivo..."
            class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-cyan-500 text-sm resize-none"></textarea>
        </div>

        <button type="submit"
          class="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-3 px-4 rounded-xl transition shadow">
          Confirmar Reserva de Cita
        </button>
      </form>
    </div>
  </main>

  <footer class="bg-gray-900 text-gray-400 py-8 border-t border-gray-800 mt-20">
    <div class="container mx-auto px-4 text-center text-sm">&copy; 2026 VetCuidado</div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
