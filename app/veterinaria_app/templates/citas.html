<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VetCuidado - Agendar Cita Online</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="bg-gray-50 text-gray-800 font-sans">

  <header class="bg-white shadow-md sticky top-0 z-50">
    <div class="container mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center">
      <div class="flex items-center space-x-2 text-cyan-600 font-bold text-2xl mb-4 sm:mb-0">
        <span>🐾</span>
        <span>VetCuidado</span>
      </div>
      <nav class="flex space-x-6 font-medium">
        <a href="index.html" class="text-gray-600 hover:text-cyan-600 transition">Inicio</a>
        <a href="index.html#servicios" class="text-gray-600 hover:text-cyan-600 transition">Servicios</a>
        <a href="mascotas.html" class="text-gray-600 hover:text-cyan-600 transition">Mis Mascotas</a>
        <a href="citas.html"
          class="bg-cyan-600 text-white px-4 py-2 rounded-lg hover:bg-cyan-700 transition shadow">Área Cliente</a>
      </nav>
    </div>
  </header>

  <main class="container mx-auto px-4 py-12 max-w-xl">

    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900 mb-2">Solicitar Cita Médica</h1>
      <p class="text-gray-600 text-sm">Rellena el formulario para reservar una consulta con nuestros especialistas
        veterinarios.</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
      <form action="#" method="POST" class="space-y-6">

        <div>
          <label for="nombre_dueno" class="block text-sm font-semibold text-gray-700 mb-2">Nombre Completo del
            Propietario</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">👤</span>
            <input type="text" id="nombre_dueno" name="nombre_dueno" required placeholder="Ej. Carlos García López"
              class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-cyan-500 focus:bg-white transition text-sm">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="nombre_mascota" class="block text-sm font-semibold text-gray-700 mb-2">Nombre de la
              Mascota</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">🐶</span>
              <input type="text" id="nombre_mascota" name="nombre_mascota" required placeholder="Ej. Rocky"
                class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-cyan-500 focus:bg-white transition text-sm">
            </div>
          </div>
          <div>
            <label for="tipo_mascota" class="block text-sm font-semibold text-gray-700 mb-2">Especie</label>
            <select id="tipo_mascota" name="tipo_mascota" required
              class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-cyan-500 focus:bg-white transition text-sm text-gray-600">
              <option value="" disabled selected>Selecciona especie</option>
              <option value="perro">Perro</option>
              <option value="gato">Gato</option>
              <option value="ave">Ave</option>
              <option value="roedor">Roedor / Otro</option>
            </select>
          </div>
        </div>

        <div>
          <label for="fecha_cita" class="block text-sm font-semibold text-gray-700 mb-2">Fecha y Hora Solicitada</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">📅</span>
            <input type="datetime-local" id="fecha_cita" name="fecha_cita" required
              class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-cyan-500 focus:bg-white transition text-sm text-gray-600">
          </div>
        </div>

        <div>
          <label for="motivo" class="block text-sm font-semibold text-gray-700 mb-2">Motivo de la Consulta</label>
          <div class="relative">
            <span class="absolute top-3 left-3 text-gray-400">📝</span>
            <textarea id="motivo" name="motivo" rows="4" required
              placeholder="Describe brevemente los síntomas o el motivo de la visita (Ej: Vacunación anual, cojera en la pata trasera, revisión general...)"
              class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-cyan-500 focus:bg-white transition text-sm resize-none"></textarea>
          </div>
        </div>

        <div class="pt-2">
          <button type="submit"
            class="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-3 px-4 rounded-xl transition shadow-md hover:shadow-lg focus:outline-none cursor-pointer text-center">
            Confirmar Reserva de Cita
          </button>
        </div>

      </form>
    </div>
  </main>

  <footer class="bg-gray-900 text-gray-400 py-8 border-t border-gray-800 mt-20">
    <div class="container mx-auto px-4 text-center sm:flex sm:justify-between sm:items-center">
      <p class="text-sm mb-4 sm:mb-0">&copy; 2026 VetCuidado. Proyecto ABP - 1º DAM/DAW.</p>
      <div class="flex justify-center space-x-6 text-sm">
        <span class="text-gray-500">Módulo: Lenguaje de Marcas</span>
      </div>
    </div>
  </footer>

</body>

</html>
